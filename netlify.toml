[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/deck"
  to = "/pitch"
  status = 301
  force = true

[[redirects]]
  from = "/scout"
  to = "/pitch"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/pitch"
  status = 301
  force = true

[[redirects]]
  from = "/data-deletion"
  to = "/pitch"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/pitch"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
